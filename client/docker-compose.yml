version: "1"

services:
  client:
    container_name: client-app
    image: docker-andy-video-streaming-client
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_SERVER=${REACT_APP_API_SERVER}
        - REACT_APP_VIDEO_SERVER=${REACT_APP_VIDEO_SERVER}
    ports:
      - 3000:3000